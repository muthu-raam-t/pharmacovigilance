services:
  # 1. NLP Training & FastAPI Container
  nlp_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text_analytics_nlp
    shm_size: '2gb'
    volumes:
      - .:/workspace
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
#      - "8888:8888"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  # 2. Database for structured event data
  postgres:
    image: postgres:15
    container_name: text_analytics_postgres
    environment:
      POSTGRES_USER: drug_user
      POSTGRES_PASSWORD: drug_password
      POSTGRES_DB: drug_safety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drug_user -d drug_safety_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Graph Database for Drug-Adverse Reaction Relationships
  neo4j:
    image: neo4j:5.18
    container_name: text_analytics_neo4j
    environment:
      NEO4J_AUTH: neo4j/drugsafety123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p drugsafety123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 4. In-memory cache
  redis:
    image: redis:7-alpine
    container_name: text_analytics_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  neo4j_data:
  hf_cache:
