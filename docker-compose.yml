services:
  # 1. NLP Training & FastAPI Container
  nlp_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text_analytics_nlp
    shm_size: '2gb'                  # PREVENTS PyTorch DataLoader crash
    volumes:
      - .:/workspace                 # Syncs current project folder
      - hf_cache:/root/.cache/huggingface  # Persists downloaded HF models
    ports:
      - "8000:8000"                  # FastAPI API endpoint
      - "8888:8888"                  # JupyterLab
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - postgres
      - neo4j
      - redis
    stdin_open: true
    tty: true

  # 2. Database for structured event data
  postgres:
    image: postgres:15
    container_name: text_analytics_postgres
    environment:
      POSTGRES_USER: drug_user
      POSTGRES_PASSWORD: drug_password
      POSTGRES_DB: drug_safety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Graph Database for Drug-Adverse Reaction Relationships
  neo4j:
    image: neo4j:5.18
    container_name: text_analytics_neo4j
    environment:
      NEO4J_AUTH: neo4j/drugsafety123
    ports:
      - "7474:7474"                  # Neo4j Browser UI
      - "7687:7687"                  # Bolt connection
    volumes:
      - neo4j_data:/data

  # 4. In-memory cache
  redis:
    image: redis:7-alpine
    container_name: text_analytics_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  neo4j_data:
  hf_cache:                          # Named volume for HuggingFace downloads
